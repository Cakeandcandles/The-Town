<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Square</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="square">
  <div class="grain"></div>
  <header>
    <h1 id="top">The Square</h1>
    <p id="status">Day 1 · 3 souls</p>
  </header>
  <div id="horizon">
    <div class="rain"></div>
    <div id="settlement"></div>
    <div class="palisade"></div>
    <div class="earth"></div>
  </div>
  <p id="win-banner">THE TOWN LIVES</p>
  <p id="dead-banner">THE TOWN IS SILENT</p>
  <div id="container">
    <div id="messages"></div>
    <div id="button-area">
      <button id="event-btn" class="event" hidden><span></span></button>
      <button id="event-btn-2" class="event" hidden><span></span></button>
      <button id="wood-btn" hidden><span>Gather wood</span></button>
      <button id="action" hidden><span>Gather brick</span></button>
      <button id="metal-btn" hidden><span>Gather metal</span></button>
      <button id="look-btn" hidden><span>Look around</span></button>
      <button id="hut-btn" hidden>
        <span>Build a hut</span>
        <span class="sub">40 wood · houses 2</span>
      </button>
      <button id="shelter-btn" hidden>
        <span>Build shelter</span>
        <span class="sub">100 wood · 70 brick · houses 4</span>
      </button>
      <button id="well-btn" hidden>
        <span>Dig a well</span>
        <span class="sub">50 brick</span>
      </button>
      <button id="palisade-btn" hidden>
        <span>Raise a palisade</span>
        <span class="sub">160 wood · 40 brick</span>
      </button>
      <button id="barn-btn" hidden>
        <span>Raise a barn</span>
        <span class="sub">90 wood · 70 brick</span>
      </button>
      <button id="forge-btn" hidden>
        <span>Build a forge</span>
        <span class="sub">70 brick · 25 metal</span>
      </button>
      <button id="tower-btn" hidden>
        <span>Build a watchtower</span>
        <span class="sub">80 wood · 60 brick · 15 metal</span>
      </button>
      <button id="hall-btn" hidden>
        <span>Raise the Town Hall</span>
        <span class="sub">280 wood · 220 brick · 50 metal</span>
      </button>
      <button id="restart-btn" hidden><span>Begin again</span></button>
      <div id="resources"></div>
    </div>
  </div>
  <script src="gather.js"></script>
</body>
</html>
