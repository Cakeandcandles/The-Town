<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Town</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="intro">
  <div class="grain"></div>
  <header>
    <h1 id="top">The Town</h1>
    <p id="status">After the flood</p>
  </header>
  <div id="horizon">
    <div class="rain"></div>
    <div id="settlement">
      <div class="ruin r1"></div>
      <div class="ruin r2"></div>
      <div class="ruin r3"></div>
    </div>
    <div class="earth"></div>
  </div>
  <div id="container">
    <div id="messages"></div>
    <div id="button-area">
      <button id="action" hidden><span>Walk around</span></button>
      <button id="skip-btn" hidden><span>Skip to the Square</span></button>
      <div id="resources"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
